## Render Blueprint — deploys one container (see /Dockerfile) with the Express
## backend and the ML priority-scoring model together: the backend spawns
## `python3 ml/predict.py` as a subprocess per scan, so there's no separate
## always-on ML service to run or wire up. Apply via Render's "New Blueprint
## Instance" pointed at this repo. Secrets marked sync: false must be set once
## in the Render dashboard after the blueprint is created — they are not
## committed here.
##
## The frontend is NOT deployed by this file — deploy it separately on Vercel
## (native Next.js support), with its root directory set to `frontend/`.

services:
  - type: web
    name: gitai-backend
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: false # deploys are triggered by .github/workflows/deploy.yml after CI passes
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8000
      - key: FRONTEND_URL
        sync: false # your Vercel production URL
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_CALLBACK_URL
        sync: false
      - key: LM_STUDIO_URL
        value: http://localhost:1234 # per-user local tunnel; see README — most users hit the cloud fallback instead
      - key: GEMINI_API_KEY
        sync: false # free tier — preferred automatically over Anthropic when both are set
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLOUD_LLM_MODEL
        value: claude-sonnet-5
      - key: JWT_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: SENTRY_DSN
        sync: false
