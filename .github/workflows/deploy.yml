name: Deploy

# Triggers a redeploy on Render after CI passes on main. Vercel deploys the
# frontend automatically on its own GitHub integration — no workflow needed here.
#
# Requires one repo secret, set once the Render service exists:
#   RENDER_BACKEND_DEPLOY_HOOK — Render "Deploy Hook" URL for the gitai-backend service
# Find it under the Render service's Settings tab. Until this secret is set,
# this workflow no-ops (the curl step is skipped) rather than failing.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger backend redeploy
        if: ${{ vars.RENDER_BACKEND_DEPLOY_HOOK != '' || secrets.RENDER_BACKEND_DEPLOY_HOOK != '' }}
        run: curl -fsS -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"
